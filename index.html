 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Flower For You 🌹</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 font-family:Georgia,serif;text-align:center;
 color:white;overflow-x:hidden;
 background:linear-gradient(160deg,#180b22,#641b40,#d45d79);
}
main{padding:35px 16px;position:relative;z-index:1}
h1{font-size:clamp(28px,7vw,44px);color:#ffdce8}
p{font-size:18px;line-height:1.7}
button{
 background:#ffcada;color:#641b40;border:0;
 padding:14px 23px;border-radius:30px;
 font-size:17px;cursor:pointer;margin:12px;
}
#garden{font-size:42px;line-height:1.8;margin:22px 0}
#message{font-size:23px;color:#ffe4ed;white-space:pre-line}
.flower{
 position:fixed;top:-40px;z-index:0;
 animation:fall linear forwards;pointer-events:none;
}
@keyframes fall{
 to{transform:translateY(110vh) rotate(360deg);opacity:.2}
}
.hidden{display:none}
</style>
</head>
